name: Build AfroBRAIN APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/afrobrain
          mkdir -p app/src/main/res/layout
          mv MainActivity.java app/src/main/java/com/afrobrain/ 2>/dev/null || cp MainActivity.java app/src/main/java/com/afrobrain/
          mv activity_main.xml app/src/main/res/layout/ 2>/dev/null || cp activity_main.xml app/src/main/res/layout/
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.afrobrain"><uses-permission android:name="android.permission.CAMERA"/><uses-feature android:name="android.hardware.camera"/><application android:label="AfroBRAIN"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'apply plugin: "com.android.application"
          android { compileSdkVersion 33; defaultConfig { applicationId "com.afrobrain"; minSdkVersion 21; targetSdkVersion 33; }; buildTypes { release { minifyEnabled false } } }
          dependencies { implementation "androidx.appcompat:appcompat:1.6.1" }' > app/build.gradle
          echo 'include ":app"' > settings.gradle
          echo 'buildscript { repositories { google(); mavenCentral() } dependencies { classpath "com.android.tools.build:gradle:7.4.2" } } allprojects { repositories { google(); mavenCentral() } }' > build.gradle
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: AfroBRAIN-APK
          path: app/build/outputs/apk/debug/*.apk
